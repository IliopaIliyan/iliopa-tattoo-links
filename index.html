<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iliopa Tattoo</title>

<style>
* {
  box-sizing: border-box;
}

html {
  background: #000;
  min-height: 100%;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-end;
  overflow-x: hidden;
}

.video-background {
  position: fixed;
  top: -20vh;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 0;
  pointer-events: none;
  transform-origin: center center;
  transition: transform 0.25s ease;
}

.video-background.explosion {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  object-fit: cover;
  object-position: center center;
  transform: scale(1.15);
  transition: none;
  -webkit-mask-image: none;
  mask-image: none;
}

.video-background.small-logo {
  transform: scale(0.70);
}

#flash {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  z-index: 1;
  pointer-events: none;
  opacity: 0;
  background: radial-gradient(
    ellipse at 50% 30%,
    rgba(255,235,180,0.65),
    rgba(255,160,40,0.28) 45%,
    rgba(255,140,30,0.12) 100%
  );
}

.buttons {
  position: relative;
  z-index: 2;
  width: 85%;
  max-width: 380px;
  padding-bottom: 25px;
}

.button {
  display: block;
  width: 100%;
  padding: 15px 10px;
  margin: 12px 0;
  text-align: center;
  text-decoration: none;
  font-size: 24px;
  font-weight: bold;
  color: white;
  background: rgba(0,0,0,0.75);
  border: 2px solid #ff8c3a;
  border-radius: 16px;
  box-shadow: 0 0 18px #ff8c3a;
  animation: electric 2s infinite;
  backdrop-filter: blur(2px);
}

.button:nth-child(2) {
  animation-delay: 0.4s;
}

.button:nth-child(3) {
  animation-delay: 0.8s;
}

.button:nth-child(4) {
  animation-delay: 1.2s;
}

@keyframes electric {
  0%, 100% {
    box-shadow: 0 0 12px #ff8c3a;
  }

  35% {
    box-shadow: 0 0 25px #ffe4b5;
  }

  65% {
    box-shadow: 0 0 30px #ff8c3a;
  }
}

.button.ignited {
  animation: ignition 0.9s ease-out;
}

@keyframes ignition {
  0% {
    box-shadow: 0 0 18px #ff8c3a;
  }

  20% {
    border-color: #ffffff;
    box-shadow:
      0 0 10px #ffffff,
      0 0 25px #ffdf80,
      0 0 45px #ff8800,
      0 0 65px #ff5500,
      inset 0 0 12px #ff8800;
  }

  55% {
    border-color: #f5fcff;
    box-shadow:
      0 0 12px #ffffff,
      0 0 25px #eaf8ff,
      0 0 45px #ffcf85,
      0 0 65px #ff9900;
  }

  80% {
    border-color: #fff4d0;
    box-shadow:
      0 0 15px #ffffff,
      0 0 35px #ff9900,
      0 0 55px #ff5500;
  }

  100% {
    box-shadow: 0 0 18px #ff8c3a;
  }
}

#sparks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

@media (prefers-reduced-motion: reduce) {
  .button, .button.ignited {
    animation: none;
  }

  .video-background {
    transition: none;
  }

  #sparks, #flash {
    display: none;
  }
}
</style>
</head>

<body>

<video id="backgroundVideo"
class="video-background"
autoplay muted loop playsinline

poster="logo.png.jpg"

<script>
const video = document.getElementById("backgroundVideo");
const canvas = document.getElementById("sparks");
const flash = document.getElementById("flash");
const ctx = canvas.getContext("2d");
const buttons = [...document.querySelectorAll(".button")];
const reduced = matchMedia("(prefers-reduced-motion: reduce)");

let particles = [];
let flames = [];
let previousTime = 0;
let burstStart = null;
let activated = new Set();
let lastFrame = 0;

function adjustSpeed() {
  const t = video.currentTime;

  const speed =
    t >= 0.5 && t < 2.0 ? 0.5 : 1;

  if (video.playbackRate !== speed) {
    video.playbackRate = speed;
  }
}

function adjustVideo() {
  const t = video.currentTime;

  const exploding =
    t >= 2.65 && t < 3.55;

  video.classList.toggle(
    "explosion", exploding
  );

  video.classList.toggle(
    "small-logo", t >= 3.55
  );

  if (exploding && !reduced.matches) {

    const progress = (t - 2.65) / 0.90;

    flash.style.opacity =
      Math.sin(progress * Math.PI) * 0.8;

  } else {

    flash.style.opacity = 0;

  }
}

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);

  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
window.addEventListener("resize", resize);

function spark(x, y, vx, vy, strong = false) {

  if (particles.length >= 850) return;

  const randomColor = Math.random();

  const color =
    randomColor < 0.65 ? "#ff8800" :
    randomColor < 0.90 ? "#ffd080" :
    randomColor < 0.97 ? "#fff4df" :
    "#eaf8ff";

  particles.push({
    x, y, vx, vy,
    life: 1,
    decay: 0.015 + Math.random() * 0.025,
    size: strong
      ? (0.45 + Math.random() * 0.75) * 0.85 * 0.95
      : 0.21 + Math.random() * 0.6,
    color,
    strong
  });
}

function createFlame(x, y) {

  if (flames.length >= 18) return;

  flames.push({
    x,
    y,
    width: 4 + Math.random() * 7,
    height: 10 + Math.random() * 20,
    life: 1,
    decay: 0.022 + Math.random() * 0.025,
    phase: Math.random() * Math.PI * 2,
    lean: (Math.random() - 0.5) * 12
  });
}

function drawFlame(f, now, dt) {

  const life = Math.max(0, f.life);

  const envelope = Math.sin(life * Math.PI);

  const flicker =
    0.8 + Math.sin(now * 0.025 + f.phase) * 0.2;

  const h = f.height * envelope * flicker;
  const w = f.width * envelope;

  if (h < 0.5 || w < 0.1) {
    f.life -= f.decay * dt;
    return;
  }

  const sway =
    Math.sin(now * 0.018 + f.phase) * 5
    + f.lean * envelope;

  ctx.save();

  ctx.translate(f.x, f.y);
  ctx.globalAlpha = envelope * 0.85;

  const gradient = ctx.createLinearGradient(
    0, 0, sway, -h
  );

  gradient.addColorStop(0, "#fff5c9");
  gradient.addColorStop(0.25, "#ffdc65");
  gradient.addColorStop(0.55, "#ff8800");
  gradient.addColorStop(0.8, "#ff4200");
  gradient.addColorStop(1, "rgba(255,50,0,0)");

  ctx.fillStyle = gradient;
  ctx.shadowColor = "#ff7700";
  ctx.shadowBlur = 8;

  ctx.beginPath();

  ctx.moveTo(-w * 0.5, 0);

  ctx.bezierCurveTo(
    -w, -h * 0.25,
    sway + w * 0.35, -h * 0.55,
    sway, -h
  );

  ctx.bezierCurveTo(
    sway - w * 0.7, -h * 0.55,
    w * 1.2, -h * 0.3,
    w * 0.5, 0
  );

  ctx.closePath();
  ctx.fill();

  ctx.globalAlpha = envelope * 0.65;
  ctx.fillStyle = "#fff1b0";
  ctx.shadowBlur = 4;

  ctx.beginPath();
  ctx.moveTo(-w * 0.18, 0);

  ctx.quadraticCurveTo(
    -w * 0.4, -h * 0.25,
    sway * 0.4, -h * 0.55
  );

  ctx.quadraticCurveTo(
    w * 0.45, -h * 0.2,
    w * 0.18, 0
  );

  ctx.closePath();
  ctx.fill();

  ctx.restore();

  f.life -= f.decay * dt;
}

function startBurst(now) {
  burstStart = now;
  activated.clear();

  for (let i = 0; i < 100; i++) {
    spark(
      innerWidth / 2 + (Math.random() - 0.5) * 80,
      innerHeight * 0.30,
      (Math.random() - 0.5) * 12,
      2 + Math.random() * 10
    );
  }
}

function borderPoint(r, p) {

  const length = 2 * (r.width + r.height);
  let d = ((p % 1 + 1) % 1) * length;

  if (d < r.width)
    return [r.left + d, r.top];

  d -= r.width;

  if (d < r.height)
    return [r.right, r.top + d];

  d -= r.height;

  if (d < r.width)
    return [r.right - d, r.bottom];

  return [r.left, r.bottom - (d - r.width)];
}

function animate(now) {

  adjustSpeed();
  adjustVideo();

  const dt = lastFrame
    ? Math.min((now - lastFrame) / 16.67, 2)
    : 1;

  lastFrame = now;

  const t = video.currentTime;

  if (!reduced.matches &&
      previousTime < 2.9 && t >= 2.9) {
    startBurst(now);
  }

  previousTime = t;

  ctx.clearRect(0, 0, innerWidth, innerHeight);

  if (burstStart !== null && !reduced.matches) {

    const elapsed = now - burstStart;

    buttons.forEach((button, i) => {

      const delay = 180 + i * 330;
      const progress = (elapsed - delay) / 900;

      if (progress >= 0 && progress <= 1) {

        const r = button.getBoundingClientRect();

        if (!activated.has(i)) {

          activated.add(i);
          button.classList.add("ignited");

          setTimeout(() => {
            button.classList.remove("ignited");
          }, 900);
        }

        for (let j = 0; j < 12; j++) {

          const [x, y] = borderPoint(
            r, progress * 2.25 + j * 0.008
          );

          spark(
            x, y,
            (Math.random() - 0.5) * 9,
            (Math.random() - 0.5) * 9,
            true
          );
        }

        if (
          progress < 0.8 &&
          Math.random() < 0.10 * dt
        ) {

          const position = Math.random();

          let fx, fy;

          if (position < 0.65) {

            fx = r.left + 16 +
              Math.random() * (r.width - 32);

            fy = r.top;

          } else if (position < 0.825) {

            fx = r.left;
            fy = r.top + Math.random() * r.height;

          } else {

            fx = r.right;
            fy = r.top + Math.random() * r.height;

          }

          createFlame(fx, fy);
        }
      }
    });

    if (elapsed > 2400) burstStart = null;
  }

  ctx.globalCompositeOperation = "lighter";

  flames = flames.filter(f => f.life > 0);

  flames.forEach(f => {
    drawFlame(f, now, dt);
  });

  particles = particles.filter(p => p.life > 0);

  particles.forEach(p => {

    ctx.globalAlpha = Math.max(0, p.life);

    const tail = p.strong ? 1.090125 : 0.6;
    const speed = p.strong ? 1.5 : 1;

    ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.strong ? 5.6525 : 3;
    ctx.lineWidth = p.size * 1.8;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(
      p.x - p.vx * tail,
      p.y - p.vy * tail
    );
    ctx.stroke();

    if
