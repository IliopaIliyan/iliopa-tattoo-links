<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iliopa Tattoo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.video-background {
  position: fixed;
  top: -20vh;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 0;
  pointer-events: none;
}

.buttons {
  position: relative;
  z-index: 2;
  width: 85%;
  max-width: 380px;
  padding-bottom: 25px;
}

.button {
  display: block;
  width: 100%;
  padding: 15px 10px;
  margin: 12px 0;
  text-align: center;
  text-decoration: none;
  font-size: 24px;
  font-weight: bold;
  color: white;
  background: rgba(0,0,0,0.75);
  border: 2px solid #ff8c3a;
  border-radius: 16px;
  box-shadow: 0 0 18px #ff8c3a;
  animation: electric 2s infinite;
  backdrop-filter: blur(2px);
}

.button:nth-child(2) {
  animation-delay: 0.4s;
}

.button:nth-child(3) {
  animation-delay: 0.8s;
}

.button:nth-child(4) {
  animation-delay: 1.2s;
}

@keyframes electric {
  0%, 100% {
    box-shadow: 0 0 12px #ff8c3a;
  }
  35% {
    box-shadow: 0 0 25px #009dff;
  }
  65% {
    box-shadow: 0 0 30px #ff8c3a;
  }
}

@media (prefers-reduced-motion: reduce) {
  .button {
    animation: none;
  }
}
</style>
</head>

<body>

<video class="video-background"
autoplay muted loop playsinline
preload="auto"
poster="logo.png.jpg"
src="3FCBDC53-5EB9-426B-8A3F-84ACEBCAFE99.mov">
</video>

<div class="buttons">

<a class="button"
href="https://instagram.com/iliopa"
target="_blank" rel="noopener">
📸 Instagram
</a>

<a class="button"
href="https://www.tiktok.com/@iliopatattoo"
target="_blank" rel="noopener">
🎬 TikTok
</a>

<a class="button"
href="https://facebook.com/iliopatattoo"
target="_blank" rel="noopener">
📘 Facebook
</a>

<a class="button"
href="https://share.google/WArYqvhvZqhWpKZ1C"
target="_blank" rel="noopener">
📍 Google Maps
</a>

</div>
</body>
</html>
