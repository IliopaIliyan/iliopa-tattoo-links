<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iliopa Tattoo</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100dvh;
  background: #000;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}

.video-background {
  position: fixed;
  top: -20vh;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  z-index: 0;
  pointer-events: none;
  transform-origin: center center;
  transition: transform 0.25s ease;
}

.video-background.small-logo {
  transform: scale(0.70);
}

.buttons {
  position: relative;
  z-index: 2;
  width: 85%;
  max-width: 380px;
  padding-bottom: 25px;
}

.button {
  display: block;
  width: 100%;
  padding: 15px 10px;
  margin: 12px 0;
  text-align: center;
  text-decoration: none;
  font-size: 24px;
  font-weight: bold;
  color: white;
  background: rgba(0,0,0,0.75);
  border: 2px solid #ff8c3a;
  border-radius: 16px;
  box-shadow: 0 0 18px #ff8c3a;
  animation: electric 2s infinite;
  backdrop-filter: blur(2px);
}

.button:nth-child(2) {
  animation-delay: 0.4s;
}

.button:nth-child(3) {
  animation-delay: 0.8s;
}

.button:nth-child(4) {
  animation-delay: 1.2s;
}

@keyframes electric {
  0%, 100% {
    box-shadow: 0 0 12px #ff8c3a;
  }

  35% {
    box-shadow: 0 0 25px #ffe4b5;
  }

  65% {
    box-shadow: 0 0 30px #ff8c3a;
  }
}

.button.ignited {
  animation: ignition 0.9s ease-out;
}

@keyframes ignition {
  0% {
    box-shadow: 0 0 18px #ff8c3a;
  }

  20% {
    border-color: #ffffff;
    box-shadow:
      0 0 10px #ffffff,
      0 0 25px #ffdf80,
      0 0 45px #ff8800,
      0 0 65px #ff5500,
      inset 0 0 12px #ff8800;
  }

  55% {
    border-color: #f5fcff;
    box-shadow:
      0 0 12px #ffffff,
      0 0 25px #eaf8ff,
      0 0 45px #ffcf85,
      0 0 65px #ff9900;
  }

  80% {
    border-color: #fff4d0;
    box-shadow:
      0 0 15px #ffffff,
      0 0 35px #ff9900,
      0 0 55px #ff5500;
  }

  100% {
    box-shadow: 0 0 18px #ff8c3a;
  }
}

#sparks {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 5;
}

@media (prefers-reduced-motion: reduce) {
  .button, .button.ignited {
    animation: none;
  }

  .video-background {
    transition: none;
  }

  #sparks {
    display: none;
  }
}
</style>
</head>

<body>

<video id="backgroundVideo"
class="video-background"
autoplay muted loop playsinline
preload="auto"
poster="logo.png.jpg"
src="3FCBDC53-5EB9-426B-8A3F-84ACEBCAFE99.mov">
</video>

<canvas id="sparks"></canvas>

<div class="buttons">

<a class="button"
href="https://instagram.com/iliopa"
target="_blank" rel="noopener">
📸 Instagram
</a>

<a class="button"
href="https://www.tiktok.com/@iliopatattoo"
target="_blank" rel="noopener">
🎬 TikTok
</a>

<a class="button"
href="https://facebook.com/iliopatattoo"
target="_blank" rel="noopener">
📘 Facebook
</a>

<a class="button"
href="https://share.google/WArYqvhvZqhWpKZ1C"
target="_blank" rel="noopener">
📍 Google Maps
</a>

</div>

<script>
const video = document.getElementById("backgroundVideo");
const canvas = document.getElementById("sparks");
const ctx = canvas.getContext("2d");
const buttons = [...document.querySelectorAll(".button")];
const reduced = matchMedia("(prefers-reduced-motion: reduce)");

let particles = [];
let previousTime = 0;
let burstStart = null;
let activated = new Set();
let lastFrame = 0;

function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);

  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

resize();
window.addEventListener("resize", resize);

function spark(x, y, vx, vy, strong = false) {

  if (particles.length >= 850) return;

  const randomColor = Math.random();

  const color =
    randomColor < 0.65 ? "#ff8800" :
    randomColor < 0.90 ? "#ffd080" :
    randomColor < 0.97 ? "#fff4df" :
    "#eaf8ff";

  particles.push({
    x, y, vx, vy,
    life: 1,
    decay: 0.015 + Math.random() * 0.025,
    size: strong
      ? 0.45 + Math.random() * 0.75
      : 0.21 + Math.random() * 0.6,
    color,
    strong
  });
}

function startBurst(now) {
  burstStart = now;
  activated.clear();

  for (let i = 0; i < 100; i++) {
    spark(
      innerWidth / 2 + (Math.random() - 0.5) * 80,
      innerHeight * 0.30,
      (Math.random() - 0.5) * 12,
      2 + Math.random() * 10
    );
  }
}

function borderPoint(r, p) {

  const length = 2 * (r.width + r.height);
  let d = ((p % 1 + 1) % 1) * length;

  if (d < r.width)
    return [r.left + d, r.top];

  d -= r.width;

  if (d < r.height)
    return [r.right, r.top + d];

  d -= r.height;

  if (d < r.width)
    return [r.right - d, r.bottom];

  return [r.left, r.bottom - (d - r.width)];
}

function animate(now) {

  const dt = lastFrame
    ? Math.min((now - lastFrame) / 16.67, 2)
    : 1;

  lastFrame = now;

  const t = video.currentTime;

  video.classList.toggle("small-logo", t >= 2.9);

  if (!reduced.matches &&
      previousTime < 2.9 && t >= 2.9) {
    startBurst(now);
  }

  previousTime = t;

  ctx.clearRect(0, 0, innerWidth, innerHeight);

  if (burstStart !== null && !reduced.matches) {

    const elapsed = now - burstStart;

    buttons.forEach((button, i) => {

      const delay = 180 + i * 330;
      const progress = (elapsed - delay) / 900;

      if (progress >= 0 && progress <= 1) {

        const r = button.getBoundingClientRect();

        if (!activated.has(i)) {

          activated.add(i);
          button.classList.add("ignited");

          setTimeout(() => {
            button.classList.remove("ignited");
          }, 900);
        }

        for (let j = 0; j < 12; j++) {

          const [x, y] = borderPoint(
            r, progress * 1.5 + j * 0.008
          );

          spark(
            x, y,
            (Math.random() - 0.5) * 9,
            (Math.random() - 0.5) * 9,
            true
          );
        }
      }
    });

    if (elapsed > 2400) burstStart = null;
  }

  ctx.globalCompositeOperation = "lighter";

  particles = particles.filter(p => p.life > 0);

  particles.forEach(p => {

    ctx.globalAlpha = Math.max(0, p.life);

    const tail = p.strong ? 1.35 : 0.6;

    ctx.strokeStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = p.strong ? 7 : 3;
    ctx.lineWidth = p.size * 1.8;
    ctx.lineCap = "round";

    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(
      p.x - p.vx * tail,
      p.y - p.vy * tail
    );
    ctx.stroke();

    if (p.strong) {

      ctx.strokeStyle = "#ffffff";
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 3;
      ctx.lineWidth = p.size * 0.65;

      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(
        p.x - p.vx * 0.75,
        p.y - p.vy * 0.75
      );
      ctx.stroke();
    }

    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 0.07 * dt;
    p.life -= p.decay * dt;
  });

  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.globalCompositeOperation = "source-over";

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);
</script>

</body>
</html>
